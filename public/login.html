<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cale — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(135deg, #0D7BFF 0%, #C3B9FF 100%);
    }

    .cale-logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      margin-bottom: 6px;
    }

    .cale-logo-lockup img {
      width: 28px;
      height: 28px;
      display: block;
      flex-shrink: 0;
    }

    .cale-wordmark {
      font-family: "Sora", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.9375rem;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
      color: #1a1a1a;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #3b82f6;
    }

    input[type="text"].error-state,
    input[type="password"].error-state {
      border-color: #ef4444;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #ef4444;
      margin-top: 8px;
      min-height: 18px;
    }

    #submit-btn {
      margin-top: 20px;
      width: 100%;
      padding: 11px;
      background: #0D7BFF;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: "Inter", sans-serif;
      transition: background 0.2s;
    }

    #submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #0D7BFF 0%, #C3B9FF 100%);
    }

    #submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="cale-logo-lockup">
      <img src="/logo.svg" alt="Cale logo" />
      <span class="cale-wordmark">Cale</span>
    </a>
    <div class="subtitle">Manager sign-in</div>

    <label for="center-id">Center ID</label>
    <input
      type="text"
      id="center-id"
      autocomplete="username"
      autofocus
      placeholder="e.g. arlington-heights"
      style="margin-bottom: 16px;"
    />

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      placeholder="Enter manager password"
    />
    <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

    <button type="button" id="submit-btn">Sign in</button>
  </div>

  <script>
    const centerInput = document.getElementById("center-id");
    const input   = document.getElementById("password");
    const errorEl = document.getElementById("error-msg");
    const btn     = document.getElementById("submit-btn");

    async function attemptLogin() {
      const centerId = centerInput.value.trim();
      const password = input.value;
      if (!centerId || !password) {
        errorEl.textContent = "Please enter your Center ID and password.";
        if (!centerId) centerInput.classList.add("error-state");
        if (!password) input.classList.add("error-state");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in…";
      errorEl.textContent = "";
      centerInput.classList.remove("error-state");
      input.classList.remove("error-state");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ centerId, password }),
        });

        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/";
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "Incorrect Center ID or password.";
          centerInput.classList.add("error-state");
          input.classList.add("error-state");
          input.select();
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      } catch {
        errorEl.textContent = "Could not reach the server. Please try again.";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    btn.addEventListener("click", attemptLogin);
    centerInput.addEventListener("keydown", (e) => { if (e.key === "Enter") input.focus(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
  </script>
</body>
</html>
