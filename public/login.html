<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cale — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background: #1a0f3c;
    }

    /* Background image */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("/login-bg.png");
      background-size: cover;
      background-position: center center;
    }

    /* ── Frosted glass card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 370px;
      background: rgba(15, 8, 40, 0.25);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow:
        0 8px 48px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* ── Logo ── */
    .cale-logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      margin-bottom: 6px;
    }

    .cale-logo-lockup img {
      width: 28px;
      height: 28px;
      display: block;
      flex-shrink: 0;
    }

    .cale-wordmark {
      font-family: "Sora", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 28px;
    }

    /* ── Form ── */
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.9375rem;
      font-family: "Inter", sans-serif;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      outline: none;
      color: #ffffff;
      transition: border-color 0.15s, background 0.15s;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: rgba(255, 255, 255, 0.28);
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #0D7BFF;
      background: rgba(13, 123, 255, 0.12);
    }

    input[type="text"].error-state,
    input[type="password"].error-state {
      border-color: #f87171;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #f87171;
      margin-top: 8px;
      min-height: 18px;
    }

    /* Both step buttons share these. Keyed on a list rather than a single
       ID so a new step's button can't silently render unstyled. */
    #submit-btn,
    #change-submit-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #0D7BFF;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-family: "Inter", sans-serif;
      transition: background 0.2s;
    }

    #submit-btn:hover:not(:disabled),
    #change-submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #0D7BFF 0%, #C3B9FF 100%);
    }

    #submit-btn:disabled,
    #change-submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <a href="/" class="cale-logo-lockup">
      <img src="/logo.svg" alt="Cale logo" />
      <span class="cale-wordmark">Cale</span>
    </a>
    <div class="subtitle" id="subtitle">Manager sign-in</div>

    <!-- Step 1: sign in with Center ID + password (temp or permanent) -->
    <div id="step-signin">
      <label for="center-id">Center ID</label>
      <input
        type="text"
        id="center-id"
        autocomplete="username"
        autofocus
        placeholder="Enter Center ID"
        style="margin-bottom: 16px;"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Enter manager password"
      />
      <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

      <button type="button" id="submit-btn">Sign in</button>
    </div>

    <!-- Step 2: shown only when /api/login reports mustChangePassword. No
         session cookie exists yet at this point -- see server.js's
         /api/login -- so this screen is the ONLY thing reachable with a
         temp password; there is nothing else to navigate to instead. -->
    <div id="step-change" style="display: none;">
      <div class="subtitle" style="margin-top: -20px; margin-bottom: 20px;">
        Set a permanent password to finish signing in.
      </div>

      <label for="new-password">New password</label>
      <input
        type="password"
        id="new-password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        style="margin-bottom: 16px;"
      />

      <label for="confirm-password">Confirm password</label>
      <input
        type="password"
        id="confirm-password"
        autocomplete="new-password"
        placeholder="Re-enter new password"
      />
      <div class="error-msg" id="change-error-msg" role="alert" aria-live="polite"></div>

      <button type="button" id="change-submit-btn">Set password &amp; sign in</button>
    </div>
  </div>

  <script>
    const centerInput = document.getElementById("center-id");
    const input   = document.getElementById("password");
    const errorEl = document.getElementById("error-msg");
    const btn     = document.getElementById("submit-btn");

    // Lives only in this tab's memory -- never a cookie, never persisted.
    // It dies with the tab if the manager closes it before setting a real
    // password, which is the point: it's single-purpose and short-lived
    // (15 min, enforced server-side regardless of what happens here).
    let _changeToken = null;

    // requireAuth bounces a frozen center's live session here with
    // ?frozen=1 (its cookie has already been cleared server-side), so the
    // manager gets told why instead of silently landing on a login page.
    if (new URLSearchParams(window.location.search).get("frozen") === "1") {
      errorEl.textContent =
        "This account has been frozen. Please contact support to restore access.";
    }

    function showChangeStep() {
      document.getElementById("subtitle").textContent = "Almost done";
      document.getElementById("step-signin").style.display = "none";
      document.getElementById("step-change").style.display = "";
      document.getElementById("new-password").focus();
    }

    function showSigninStep(message) {
      _changeToken = null;
      document.getElementById("subtitle").textContent = "Manager sign-in";
      document.getElementById("step-change").style.display = "none";
      document.getElementById("step-signin").style.display = "";
      document.getElementById("new-password").value = "";
      document.getElementById("confirm-password").value = "";
      input.value = "";
      if (message) errorEl.textContent = message;
      input.focus();
    }

    async function attemptLogin() {
      const centerId = centerInput.value.trim();
      const password = input.value;
      if (!centerId || !password) {
        errorEl.textContent = "Please enter your Center ID and password.";
        if (!centerId) centerInput.classList.add("error-state");
        if (!password) input.classList.add("error-state");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Signing in…";
      errorEl.textContent = "";
      centerInput.classList.remove("error-state");
      input.classList.remove("error-state");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ centerId, password }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.mustChangePassword) {
          // Correct temp password, but no session was issued — see
          // server.js's /api/login. Hold the change token in memory and
          // swap to the set-password step, same page, no navigation.
          _changeToken = data.changeToken;
          btn.disabled = false;
          btn.textContent = "Sign in";
          showChangeStep();
        } else if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/";
        } else if (res.status === 403 && data.frozen) {
          // The credentials were CORRECT — the account is switched off. Don't
          // mark the fields as wrong or re-select the password; there's
          // nothing to retype.
          errorEl.textContent = data.error || "This account has been frozen.";
          btn.disabled = false;
          btn.textContent = "Sign in";
        } else {
          errorEl.textContent = data.error || "Incorrect Center ID or password.";
          centerInput.classList.add("error-state");
          input.classList.add("error-state");
          input.select();
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      } catch {
        errorEl.textContent = "Could not reach the server. Please try again.";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    const changeErrorEl = document.getElementById("change-error-msg");
    const changeBtn     = document.getElementById("change-submit-btn");
    const newPwInput    = document.getElementById("new-password");
    const confirmPwInput = document.getElementById("confirm-password");

    async function attemptChangePassword() {
      const newPassword = newPwInput.value;
      const confirmPassword = confirmPwInput.value;
      changeErrorEl.textContent = "";
      newPwInput.classList.remove("error-state");
      confirmPwInput.classList.remove("error-state");

      if (!newPassword || newPassword.length < 8) {
        changeErrorEl.textContent = "Password must be at least 8 characters.";
        newPwInput.classList.add("error-state");
        return;
      }
      if (newPassword !== confirmPassword) {
        changeErrorEl.textContent = "Passwords don't match.";
        confirmPwInput.classList.add("error-state");
        return;
      }
      if (!_changeToken) {
        // Token was cleared (e.g. tab was reloaded) -- nothing to redeem.
        showSigninStep("Please sign in again with your temporary password.");
        return;
      }

      changeBtn.disabled = true;
      changeBtn.textContent = "Setting password…";
      try {
        const res = await fetch("/api/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ changeToken: _changeToken, newPassword }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/";
          return;
        }
        if (res.status === 401) {
          // The 15-minute change token expired -- the temp password itself
          // is still valid (mustChangePassword was never cleared), so the
          // only way back in is signing in again to get a fresh token.
          showSigninStep(data.error || "This link expired. Please sign in again.");
          return;
        }
        changeErrorEl.textContent = data.error || "Something went wrong.";
        changeBtn.disabled = false;
        changeBtn.textContent = "Set password & sign in";
      } catch {
        changeErrorEl.textContent = "Could not reach the server. Please try again.";
        changeBtn.disabled = false;
        changeBtn.textContent = "Set password & sign in";
      }
    }

    btn.addEventListener("click", attemptLogin);
    centerInput.addEventListener("keydown", (e) => { if (e.key === "Enter") input.focus(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });

    changeBtn.addEventListener("click", attemptChangePassword);
    newPwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmPwInput.focus(); });
    confirmPwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptChangePassword(); });
  </script>
</body>
</html>
