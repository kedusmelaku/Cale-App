<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scheduler — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.9375rem;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
      color: #1a1a1a;
    }

    input[type="password"]:focus {
      border-color: #3b82f6;
    }

    input[type="password"].error-state {
      border-color: #ef4444;
    }

    .error-msg {
      font-size: 0.8125rem;
      color: #ef4444;
      margin-top: 8px;
      min-height: 18px;
    }

    button[type="submit"] {
      margin-top: 20px;
      width: 100%;
      padding: 11px;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: #333;
    }

    button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Scheduler</div>
    <div class="subtitle">Manager sign-in</div>

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      autofocus
      placeholder="Enter manager password"
    />
    <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

    <button type="submit" id="submit-btn">Sign in</button>
  </div>

  <script>
    const input   = document.getElementById("password");
    const errorEl = document.getElementById("error-msg");
    const btn     = document.getElementById("submit-btn");

    async function attemptLogin() {
      const password = input.value;
      if (!password) return;

      btn.disabled = true;
      btn.textContent = "Signing in…";
      errorEl.textContent = "";
      input.classList.remove("error-state");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          // Redirect to wherever the user was trying to go, defaulting to /
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get("next") || "/";
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "Incorrect password.";
          input.classList.add("error-state");
          input.select();
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      } catch {
        errorEl.textContent = "Could not reach the server. Please try again.";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    btn.addEventListener("click", attemptLogin);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") attemptLogin();
    });
  </script>
</body>
</html>
