<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Availability — Cale</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/utils.js"></script>
    <style>
      /* ── Availability form page styles ── */
      .av-form-shell {
        max-width: 480px;
        margin: 40px auto;
        padding: 0 20px 60px;
      }

      .av-form-header {
        margin-bottom: 28px;
      }

      .av-form-header h1 {
        font-family: "Noto Serif", serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
      }

      .av-form-header p {
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      .av-form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .av-form-card + .av-form-card {
        margin-top: 16px;
      }

      .pin-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .pin-field {
        flex: 1;
      }

      .pin-input {
        width: 100%;
        padding: 10px 14px;
        background: var(--surface2);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: "Noto Sans", sans-serif;
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        text-align: center;
      }

      .pin-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .window-status {
        font-size: 0.85rem;
        padding: 10px 14px;
        border-radius: var(--radius);
        margin-bottom: 20px;
      }

      .window-status.open {
        background: var(--green-bg);
        color: var(--green-on-tint);
        border: 1px solid var(--green);
      }

      .window-status.closed {
        background: var(--surface2);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .greeting {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 18px;
      }

      .week-label {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-bottom: 20px;
      }

      /* Day rows */
      .av-day-block {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--surface2);
      }

      .av-day-block.selected {
        border-color: var(--accent);
        background: var(--accent-light);
      }

      .av-day-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .av-day-name {
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--text);
        flex: 1;
      }

      .av-day-hours {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .av-hours-check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-mid);
        cursor: pointer;
      }

      .av-time-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-mid);
      }

      .av-time-row select {
        padding: 6px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: "Noto Sans", sans-serif;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .submit-btn {
        width: 100%;
        padding: 13px;
        margin-top: 20px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-family: "Noto Sans", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .submit-btn:hover { background: var(--accent-hover); }
      .submit-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }

      .av-select-all-form {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 10px;
        cursor: pointer;
      }
      .av-select-all-form input[type="checkbox"] {
        accent-color: var(--accent);
        cursor: pointer;
        width: 15px;
        height: 15px;
      }

      /* Confirmation modal */
      .confirm-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .confirm-overlay.open { display: flex; }
      .confirm-modal {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        padding: 28px 24px 24px;
        width: 100%;
        max-width: 380px;
      }
      .confirm-modal h3 {
        font-family: "Noto Serif", serif;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 16px;
      }
      .confirm-day-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
      }
      .confirm-day-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 0.88rem;
      }
      .confirm-day-name {
        font-weight: 600;
        color: var(--text);
        min-width: 90px;
      }
      .confirm-day-hours {
        color: var(--text-muted);
        font-size: 0.83rem;
      }
      .confirm-actions {
        display: flex;
        gap: 10px;
      }
      .confirm-actions button {
        flex: 1;
        padding: 10px;
        border-radius: var(--radius);
        font-family: "Noto Sans", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
      }
      .confirm-cancel {
        background: var(--surface2);
        color: var(--text);
        border: 1.5px solid var(--border) !important;
      }
      .confirm-submit {
        background: var(--accent);
        color: #fff;
      }
      .confirm-submit:hover { background: var(--accent-hover); }

      .error-msg {
        font-size: 0.85rem;
        color: #c0392b;
        margin-top: 10px;
      }

      .success-card {
        text-align: center;
        padding: 40px 24px;
      }

      .success-icon { font-size: 2.5rem; margin-bottom: 14px; }

      .success-title {
        font-family: "Noto Serif", serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 8px;
      }

      .success-sub {
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      #step-pin, #step-form, #step-success { display: none; }
      #step-pin.active, #step-form.active, #step-success.active { display: block; }

      /* Two-block day grouping */
      .av-block-group + .av-block-group {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
      }
      .av-sub-indent { margin-left: 24px; margin-top: 6px; }
      .av-empty-note { font-size: 0.88rem; color: var(--text-muted); padding: 8px 0; }
    </style>
  </head>
  <body>
    <div class="av-form-shell">
      <div class="av-form-header">
        <h1>Submit Availability</h1>
        <p>Enter your PIN to submit your availability for the upcoming week.</p>
      </div>

      <!-- Step 1: PIN entry -->
      <div id="step-pin" class="active">
        <div class="av-form-card">
          <div id="window-status-msg" class="window-status" style="display:none;"></div>
          <label class="field-label" for="pin-input">Your PIN</label>
          <div class="pin-row">
            <div class="pin-field">
              <input
                type="number"
                id="pin-input"
                class="pin-input"
                placeholder="0000"
                maxlength="4"
                min="0"
                max="9999"
                autocomplete="off"
              />
            </div>
            <button class="btn-primary" onclick="lookupPin()">Continue →</button>
          </div>
          <div id="pin-error" class="error-msg" style="display:none;"></div>
        </div>
      </div>

      <!-- Step 2: Availability form -->
      <div id="step-form">
        <div class="av-form-card">
          <div id="greeting" class="greeting"></div>
          <div id="week-label" class="week-label"></div>
          <label class="av-select-all-form" id="select-all-label">
            <input type="checkbox" id="select-all-days" onchange="toggleAllDaysForm(this.checked)">
            <span>Select all days</span>
          </label>
          <div id="day-list"></div>
          <button class="submit-btn" id="submit-btn" onclick="showConfirm()">
            Submit Availability
          </button>
          <div id="submit-error" class="error-msg" style="display:none;"></div>
        </div>
      </div>

      <!-- Step 3: Success -->
      <div id="step-success">
        <div class="av-form-card success-card">
          <div class="success-icon">✅</div>
          <div class="success-title">Availability submitted!</div>
          <div class="success-sub" id="success-sub">Your availability has been saved.</div>
        </div>
      </div>
      <!-- Confirmation modal -->
      <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-modal">
          <h3>Confirm your availability</h3>
          <div class="confirm-day-list" id="confirm-day-list"></div>
          <div class="confirm-actions">
            <button class="confirm-cancel" onclick="closeConfirm()">Edit</button>
            <button class="confirm-submit" id="confirm-submit-btn" onclick="doSubmit()">Submit →</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Day metadata + buildSchedule() come from utils.js.
      let _employee = null;
      let _weekOf = null;
      let _windowOpen = null;
      let _windowClose = null;
      let _sched = null; // buildSchedule() view of the center's active variant
      let _defaults = null; // per-priority default windows [{start,end} x3]

      // Pull the three per-priority default windows off a variant's days object.
      function readDefaults(days) {
        return days && Array.isArray(days.defaults) && days.defaults.length === 3
          ? days.defaults
          : null;
      }

      // Extract centerId from URL path: /availability/arlington-heights
      const _centerId = window.location.pathname.split("/").filter(Boolean)[1] || "";

      // ── Init ───────────────────────────────────────────────
      (async function init() {
        if (!_centerId) {
          document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;color:#666;'>Invalid availability link. Please contact your manager.</p>";
          return;
        }

        // Apply saved theme
        const saved = JSON.parse(localStorage.getItem("scheduler-settings") || "{}");
        if (saved.theme === "dark") document.body.classList.add("dark");

        // Load center settings to check window and get week
        try {
          const res = await fetch(`/center-settings/${_centerId}`);
          const data = await res.json();
          const s = data.data;
          _windowOpen  = (s && s.windowOpen)  ? new Date(s.windowOpen)  : null;
          _windowClose = (s && s.windowClose) ? new Date(s.windowClose) : null;
        } catch (e) {
          console.warn("Could not load center settings:", e.message);
        }

        // Load the center's active operating schedule (open days + hours/blocks)
        try {
          const res = await fetch(`/center-schedule/${_centerId}`);
          const data = await res.json();
          const days = data.data && data.data.days;
          _sched = buildSchedule(days);
          _defaults = readDefaults(days);
        } catch (e) {
          console.warn("Could not load center schedule:", e.message);
          _sched = buildSchedule(null);
        }

        // Determine weekOf from window open date, or default to next Monday
        _weekOf = _windowOpen
          ? getMondayStrictlyAfter(_windowOpen)
          : getNextMonday();

        updateWindowStatus();
      })();

      function getMondayOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = day === 0 ? 6 : day - 1;
        d.setDate(d.getDate() - diff);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      }

      function getMondayStrictlyAfter(date) {
        const d = new Date(date);
        const day = d.getDay();
        const daysUntil = day === 1 ? 7 : (8 - day) % 7;
        d.setDate(d.getDate() + daysUntil);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      }

      function getNextMonday() {
        const today = new Date();
        const day = today.getDay();
        const daysUntil = day === 1 ? 0 : (8 - day) % 7;
        const monday = new Date(today);
        monday.setDate(today.getDate() + daysUntil);
        const y = monday.getFullYear();
        const m = String(monday.getMonth() + 1).padStart(2, "0");
        const d = String(monday.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr + "T00:00:00");
        return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      }

      function formatDateTime(date) {
        if (!date) return "";
        return date.toLocaleString("en-US", {
          weekday: "short", month: "short", day: "numeric",
          hour: "numeric", minute: "2-digit",
        });
      }

      function isWindowOpen() {
        if (!_windowOpen) return true; // no window configured = always open
        const now = new Date();
        if (now < _windowOpen) return false; // not open yet
        if (!_windowClose) return true;      // open with no close time = manually open
        return now <= _windowClose;
      }

      function updateWindowStatus() {
        const el = document.getElementById("window-status-msg");
        if (!_windowOpen) {
          el.style.display = "none";
          return;
        }
        el.style.display = "block";
        const now = new Date();
        if (now < _windowOpen) {
          // Scheduled — not open yet
          el.className = "window-status closed";
          el.textContent = `Submissions open ${formatDateTime(_windowOpen)}`;
        } else if (!_windowClose || now <= _windowClose) {
          // Open: either no close time (manual) or close time hasn't passed
          el.className = "window-status open";
          el.textContent = _windowClose
            ? `Submissions open until ${formatDateTime(_windowClose)}`
            : "Submissions open";
        } else {
          // Past close time
          el.className = "window-status closed";
          el.textContent = `Submissions closed as of ${formatDateTime(_windowClose)}`;
        }
      }

      // ── PIN lookup ─────────────────────────────────────────
      async function lookupPin() {
        const pin = document.getElementById("pin-input").value.trim().padStart(4, "0");
        const errEl = document.getElementById("pin-error");
        errEl.style.display = "none";

        if (!pin || pin.length > 4) {
          errEl.textContent = "Please enter your 4-digit PIN.";
          errEl.style.display = "block";
          return;
        }

        // Re-fetch center settings on every attempt so window state and weekOf
        // are always current, even if the page has been open a long time.
        try {
          const s = await fetch(`/center-settings/${_centerId}`).then(r => r.json());
          _windowOpen  = s.data?.windowOpen  ? new Date(s.data.windowOpen)  : null;
          _windowClose = s.data?.windowClose ? new Date(s.data.windowClose) : null;
          _weekOf = _windowOpen ? getMondayStrictlyAfter(_windowOpen) : getNextMonday();
          updateWindowStatus();
        } catch (e) {
          console.warn("Could not refresh center settings:", e.message);
        }

        // Make sure we have the operating schedule before showing the form.
        if (!_sched || _sched.days.length === 0 || !_defaults) {
          try {
            const sc = await fetch(`/center-schedule/${_centerId}`).then(r => r.json());
            const days = sc.data && sc.data.days;
            _sched = buildSchedule(days);
            _defaults = readDefaults(days);
          } catch (e) {
            console.warn("Could not refresh center schedule:", e.message);
          }
        }

        if (!isWindowOpen()) {
          errEl.textContent = "The availability window is not currently open.";
          errEl.style.display = "block";
          return;
        }

        try {
          const res = await fetch("/availability/lookup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin, centerId: _centerId }),
          });
          const data = await res.json();
          if (!res.ok) {
            errEl.textContent = data.error || "PIN not found. Please try again.";
            errEl.style.display = "block";
            return;
          }
          _employee = data.data;
          showForm();
        } catch (e) {
          errEl.textContent = "Something went wrong. Please try again.";
          errEl.style.display = "block";
        }
      }

      // Allow Enter key on PIN input
      document.getElementById("pin-input").addEventListener("keydown", function(e) {
        if (e.key === "Enter") lookupPin();
      });

      // ── Form ────────────────────────────────────────────────
      function showForm() {
        document.getElementById("step-pin").classList.remove("active");
        document.getElementById("step-form").classList.add("active");

        document.getElementById("greeting").textContent =
          `Hi ${_employee.name.charAt(0).toUpperCase() + _employee.name.slice(1)} 👋`;
        document.getElementById("week-label").textContent =
          `Week of ${formatDate(_weekOf)}`;

        renderDays();
      }

      // Time options within a single operating block (canonical minutes)
      function blockTimeOptions(startMin, endMin) {
        const out = [];
        for (let m = startMin; m <= endMin; m += 30) out.push({ value: m, label: minToLabel(m) });
        return out;
      }

      // Friendly label for a block based on when it starts
      function blockName(startMin) {
        if (startMin < 12 * 60) return "Morning";
        if (startMin < 17 * 60) return "Afternoon";
        return "Evening";
      }

      // Form state: dayState[dayKey] = { selected, blocks: [{ on, allBlock, start, end }] }
      // blocks runs parallel to the center's operating blocks for that day.
      const dayState = {};

      // The active employee's priority-default window (null → fall back to full
      // operating hours). Mirrors scheduleConfig.DEFAULT_PRIORITY_WINDOWS use.
      function priorityWindow() {
        const p = _employee && typeof _employee.priority === "number" ? _employee.priority : 0;
        return _defaults && _defaults[p] ? _defaults[p] : null;
      }

      // Client mirror of scheduleConfig.defaultBlocksFor: Mon–Fri clip each
      // operating block to the priority window; Sat/Sun use full hours. Falls
      // back to full hours if the clip would leave the day empty, so a selected
      // day is never seeded with zero availability.
      function defaultBlocksFor(dayKey, operatingBlocks, win) {
        const ops = (operatingBlocks || []).map((b) => ({ start: b.start, end: b.end }));
        const isWeekend = dayKey === "saturday" || dayKey === "sunday";
        if (isWeekend || !win) return ops;
        const out = [];
        for (const b of ops) {
          const s = Math.max(b.start, win.start);
          const e = Math.min(b.end, win.end);
          if (s < e) out.push({ start: s, end: e });
        }
        return out.length ? out : ops;
      }

      // Reconstruct per-operating-block edit state from a concrete blocks array.
      // A block fully covered by its default → allBlock; a partial cover → a
      // custom range pre-filled to the default window.
      function deriveBlockState(blocks, op) {
        return op.map((b) => {
          const sb = (blocks || []).find((x) => x.start < b.end && x.end > b.start);
          if (!sb) return { on: false, allBlock: false, start: b.start, end: b.end };
          const start = Math.max(sb.start, b.start);
          const end = Math.min(sb.end, b.end);
          const allBlock = start <= b.start && end >= b.end;
          return { on: true, allBlock, start, end };
        });
      }

      function ensureDayState(d) {
        const op = _sched.blocks(d);
        if (!dayState[d] || dayState[d].blocks.length !== op.length) {
          const seed = defaultBlocksFor(d, op, priorityWindow());
          dayState[d] = {
            selected: dayState[d] ? dayState[d].selected : false,
            blocks: deriveBlockState(seed, op),
          };
        }
        return dayState[d];
      }

      function renderDays() {
        const list = document.getElementById("day-list");
        list.innerHTML = "";

        if (!_sched || _sched.days.length === 0) {
          list.innerHTML = '<div class="av-empty-note">This center has no open days set up yet. Please check with your manager.</div>';
          const sa = document.getElementById("select-all-label");
          if (sa) sa.style.display = "none";
          return;
        }

        _sched.days.forEach((d) => {
          const st = ensureDayState(d);
          const op = _sched.blocks(d);
          const multi = op.length > 1;

          let hoursHtml = "";
          if (st.selected) {
            hoursHtml = op.map((b, i) => {
              const bs = st.blocks[i];
              const on = multi ? bs.on : true;
              const opts = blockTimeOptions(b.start, b.end);
              const rangeLabel = `${minToLabel(b.start)} – ${minToLabel(b.end)}`;

              const onToggle = multi ? `
                <label class="av-hours-check">
                  <input type="checkbox" ${on ? "checked" : ""} onchange="toggleBlockOn('${d}',${i},this.checked)">
                  ${blockName(b.start)} block (${rangeLabel})
                </label>` : "";

              let inner = "";
              if (on) {
                const startOpts = opts.filter((o) => o.value < b.end);
                const endOpts = opts.filter((o) => o.value > b.start);
                // No "full hours / custom" toggle here on purpose — the selects
                // are always visible, pre-filled to the employee's priority
                // default (via defaultBlocksFor/deriveBlockState above), and
                // directly editable. Employees never see the words "default"
                // or "priority" — that's manager-side vocabulary.
                inner = `
                  <div class="av-time-row ${multi ? "av-sub-indent" : ""}">
                    <select aria-label="Start time" onchange="updateTime('${d}',${i},'start',this.value)">
                      ${startOpts.map((o) => `<option value="${o.value}" ${o.value === bs.start ? "selected" : ""}>${o.label}</option>`).join("")}
                    </select>
                    <span>–</span>
                    <select aria-label="End time" onchange="updateTime('${d}',${i},'end',this.value)">
                      ${endOpts.map((o) => `<option value="${o.value}" ${o.value === bs.end ? "selected" : ""}>${o.label}</option>`).join("")}
                    </select>
                  </div>`;
              }
              return `<div class="av-block-group">${onToggle}${inner}</div>`;
            }).join("");
          }

          const block = document.createElement("div");
          block.className = `av-day-block${st.selected ? " selected" : ""}`;
          block.innerHTML = `
            <div class="av-day-top">
              <input type="checkbox" id="day-${d}" ${st.selected ? "checked" : ""}
                onchange="toggleDay('${d}', this.checked)" aria-label="${_sched.dayFull(d)}">
              <label class="av-day-name" for="day-${d}">${_sched.dayFull(d)}</label>
            </div>
            ${st.selected ? `<div class="av-day-hours">${hoursHtml}</div>` : ""}`;
          list.appendChild(block);
        });

        // Sync the select-all checkbox
        const allChecked = _sched.days.every((d) => dayState[d]?.selected);
        const anyChecked = _sched.days.some((d) => dayState[d]?.selected);
        const selectAll = document.getElementById("select-all-days");
        if (selectAll) {
          selectAll.checked = allChecked;
          selectAll.indeterminate = !allChecked && anyChecked;
        }
      }

      function toggleAllDaysForm(checked) {
        _sched.days.forEach((d) => { ensureDayState(d).selected = checked; });
        renderDays();
      }

      function toggleDay(d, checked) {
        ensureDayState(d).selected = checked;
        renderDays();
      }

      function toggleBlockOn(d, i, checked) {
        ensureDayState(d).blocks[i].on = checked;
        renderDays();
      }

      function updateTime(d, i, field, val) {
        const m = parseInt(val, 10);
        const st = ensureDayState(d);
        const bs = st.blocks[i];
        if (field === "start") {
          if (m >= bs.end) { renderDays(); return; }
          bs.start = m;
        } else {
          if (m <= bs.start) { renderDays(); return; }
          bs.end = m;
        }
        // No UI toggle sets this anymore — recompute from the edited range so
        // collectDays()'s allDay calculation still reflects reality.
        const op = _sched.blocks(d)[i];
        bs.allBlock = op ? bs.start <= op.start && bs.end >= op.end : false;
        renderDays();
      }

      // Builds the submission payload: selected days with their active blocks.
      function collectDays() {
        if (!_sched) return [];
        return _sched.days
          .filter((d) => dayState[d]?.selected)
          .map((d) => {
            const st = dayState[d];
            const op = _sched.blocks(d);
            const multi = op.length > 1;
            const blocks = [];
            st.blocks.forEach((bs, i) => {
              const on = multi ? bs.on : true;
              if (!on) return;
              blocks.push({
                start: bs.allBlock ? op[i].start : bs.start,
                end:   bs.allBlock ? op[i].end   : bs.end,
              });
            });
            const allDay =
              blocks.length === op.length &&
              st.blocks.every((bs, i) => (multi ? bs.on : true) && bs.allBlock);
            return { day: d, selected: true, allDay, blocks };
          })
          .filter((c) => c.blocks.length > 0);
      }

      // ── Confirmation modal ──────────────────────────────────
      function showConfirm() {
        const errEl = document.getElementById("submit-error");
        errEl.style.display = "none";

        const chosen = collectDays();
        if (chosen.length === 0) {
          errEl.textContent = "Please select at least one day and time.";
          errEl.style.display = "block";
          return;
        }

        const list = document.getElementById("confirm-day-list");
        list.innerHTML = chosen.map((c) => {
          const hoursStr = c.blocks.map((b) => `${minToLabel(b.start)} – ${minToLabel(b.end)}`).join(", ");
          return `<div class="confirm-day-row">
            <span class="confirm-day-name">${_sched.dayFull(c.day)}</span>
            <span class="confirm-day-hours">${hoursStr}</span>
          </div>`;
        }).join("");

        const btn = document.getElementById("confirm-submit-btn");
        btn.disabled = false;
        btn.textContent = "Submit →";
        document.getElementById("confirm-overlay").classList.add("open");
      }

      function closeConfirm() {
        document.getElementById("confirm-overlay").classList.remove("open");
      }

      async function doSubmit() {
        const confirmBtn = document.getElementById("confirm-submit-btn");
        const errEl = document.getElementById("submit-error");

        const days = collectDays();

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Submitting…";

        try {
          const res = await fetch("/submissions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              centerId: _centerId,
              employeeId: _employee._id,
              employeeName: _employee.name,
              weekOf: _weekOf,
              days,
            }),
          });
          const data = await res.json();
          closeConfirm();
          if (!res.ok) {
            errEl.textContent = data.error || "Something went wrong. Please try again.";
            errEl.style.display = "block";
            confirmBtn.disabled = false;
            confirmBtn.textContent = "Submit →";
            return;
          }
          showSuccess();
        } catch (e) {
          closeConfirm();
          errEl.textContent = "Something went wrong. Please try again.";
          errEl.style.display = "block";
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Submit →";
        }
      }

      function showSuccess() {
        document.getElementById("step-form").classList.remove("active");
        document.getElementById("step-success").classList.add("active");
        document.getElementById("success-sub").textContent =
          `${_employee.name.charAt(0).toUpperCase() + _employee.name.slice(1)}'s availability for the week of ${formatDate(_weekOf)} has been saved.`;
      }
    </script>
  </body>
</html>
