<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cale — Admin</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body.admin-page {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
  </style>
</head>
<body class="admin-page">
  <div class="admin-card">
    <div class="admin-badge">Admin</div>
    <a href="/" class="cale-logo-lockup" style="margin-bottom: 4px; display: inline-flex;">
      <img src="/logo.svg" alt="Cale logo" />
      <span class="cale-wordmark">Cale</span>
    </a>
    <div class="admin-subtitle">Admin access only</div>
    <label for="password">Admin Password</label>
    <input type="password" id="password" autocomplete="current-password" autofocus placeholder="Enter admin password" />
    <div class="admin-error-msg" id="error-msg" role="alert" aria-live="polite"></div>
    <button type="button" class="admin-submit-btn" id="submit-btn">Sign in</button>
  </div>
  <script>
    const input = document.getElementById("password");
    const errorEl = document.getElementById("error-msg");
    const btn = document.getElementById("submit-btn");

    async function attemptLogin() {
      const password = input.value;
      if (!password) return;
      btn.disabled = true;
      btn.textContent = "Signing in…";
      errorEl.textContent = "";
      input.classList.remove("error-state");
      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          window.location.href = "/admin";
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "Incorrect password.";
          input.classList.add("error-state");
          input.select();
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      } catch {
        errorEl.textContent = "Could not reach the server.";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    btn.addEventListener("click", attemptLogin);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
  </script>
</body>
</html>
