<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Scheduler</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="admin-page">
  <div class="admin-topbar">
    <div class="admin-topbar-left">
      <span class="admin-topbar-title">Scheduler</span>
      <span class="admin-topbar-badge">Admin</span>
    </div>
    <button class="admin-btn-ghost" onclick="logout()">Sign out</button>
  </div>

  <!-- ── List View ── -->
  <div id="view-list" class="view active">
    <div class="admin-main">
      <div class="admin-section-header">
        <span class="admin-section-title">Centers</span>
        <button class="admin-btn-primary" onclick="openAddModal()">+ Add Center</button>
      </div>
      <div id="centers-list"><div class="admin-loading">Loading…</div></div>
    </div>
  </div>

  <!-- ── Detail View ── -->
  <div id="view-detail" class="view">
    <div class="detail-main">
      <div class="detail-toprow">
        <div class="detail-title-block">
          <button class="admin-btn-ghost-dark" onclick="showList()" style="margin-bottom:16px;">← All Centers</button>
          <div class="detail-name" id="d-name">—</div>
          <div class="detail-id" id="d-id">—</div>
        </div>
        <div class="detail-actions">
          <button class="admin-btn-edit" id="d-edit-btn">Edit</button>
          <button class="admin-btn-delete" id="d-delete-btn">Delete</button>
        </div>
      </div>

      <!-- Stats row -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Employees</div>
          <div class="stat-value" id="d-emp-count">—</div>
          <div class="stat-sub" id="d-pin-sub">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Submissions</div>
          <div class="stat-value" id="d-sub-count">—</div>
          <div class="stat-sub" id="d-sub-sub">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Calendar</div>
          <div class="stat-value" id="d-cal-val">—</div>
          <div class="stat-sub" id="d-cal-sub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Form Window</div>
          <div class="stat-value" id="d-form-val">—</div>
          <div class="stat-sub" id="d-form-sub">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Last Submission</div>
          <div class="stat-value" id="d-activity-val" style="font-size:1rem; padding-top:4px;">—</div>
          <div class="stat-sub" id="d-activity-sub"></div>
        </div>
      </div>

      <!-- Employee list -->
      <div class="detail-section">
        <div class="detail-section-title">Team</div>
        <div class="employee-table" id="d-emp-list">
          <div class="emp-empty">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="admin-modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="admin-modal">
      <div class="admin-modal-title" id="modal-title">Add Center</div>
      <div class="admin-field" id="field-centerid">
        <label for="m-centerid">Center ID</label>
        <input type="text" id="m-centerid" placeholder="e.g. arlington-heights" autocomplete="off" />
        <div class="admin-field-hint">Lowercase letters and hyphens only. This is what managers type at login.</div>
      </div>
      <div class="admin-field">
        <label for="m-name">Display Name</label>
        <input type="text" id="m-name" placeholder="e.g. Arlington Heights Mathnasium" autocomplete="off" />
      </div>
      <div class="admin-field">
        <label for="m-password">Password</label>
        <input type="password" id="m-password" placeholder="Manager password for this center" autocomplete="new-password" />
        <div class="admin-field-hint" id="m-password-hint">Leave blank to keep the existing password.</div>
      </div>
      <div class="admin-modal-error" id="modal-error"></div>
      <div class="admin-modal-actions">
        <button class="admin-btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="admin-btn-primary" id="modal-submit" onclick="submitModal()">Add Center</button>
      </div>
    </div>
  </div>

  <script>
    let _centers = [];
    let _editingCenterId = null;
    let _detailCenterId = null;

    // ── View switching ────────────────────────────────────────
    function showList() {
      document.getElementById("view-list").classList.add("active");
      document.getElementById("view-detail").classList.remove("active");
      _detailCenterId = null;
    }

    function showDetail() {
      document.getElementById("view-list").classList.remove("active");
      document.getElementById("view-detail").classList.add("active");
    }

    // ── List view ─────────────────────────────────────────────
    async function loadCenters() {
      try {
        const res = await fetch("/api/admin/centers");
        if (res.status === 401) { window.location.href = "/admin/login"; return; }
        const data = await res.json();
        _centers = data.data || [];
        renderCenters();
      } catch {
        document.getElementById("centers-list").innerHTML = "<div class='admin-empty'>Failed to load centers.</div>";
      }
    }

    function renderCenters() {
      const el = document.getElementById("centers-list");
      if (_centers.length === 0) {
        el.innerHTML = "<div class='admin-empty'>No centers yet. Add one to get started.</div>";
        return;
      }
      el.innerHTML = _centers.map(c => `
        <div class="center-card" onclick="openDetail('${esc(c.centerId)}')">
          <div>
            <div class="center-name">${esc(c.name)}</div>
            <div class="center-id">${esc(c.centerId)}</div>
          </div>
          <div class="card-right">
            <button class="admin-btn-edit" onclick="event.stopPropagation(); openEditModal('${esc(c.centerId)}')">Edit</button>
            <button class="admin-btn-delete" onclick="event.stopPropagation(); deleteCenter('${esc(c.centerId)}', '${esc(c.name)}')">Delete</button>
            <span class="card-arrow">›</span>
          </div>
        </div>
      `).join("");
    }

    // ── Detail view ───────────────────────────────────────────
    async function openDetail(centerId) {
      _detailCenterId = centerId;
      showDetail();

      document.getElementById("d-name").textContent = "Loading…";
      document.getElementById("d-id").textContent = centerId;
      document.getElementById("d-emp-list").innerHTML = "<div class='emp-empty'>Loading…</div>";
      ["d-emp-count","d-pin-sub","d-sub-count","d-sub-sub","d-cal-val","d-cal-sub","d-form-val","d-form-sub","d-activity-val","d-activity-sub"]
        .forEach(id => { document.getElementById(id).textContent = "—"; });

      try {
        const res = await fetch(`/api/admin/centers/${centerId}/details`);
        if (res.status === 401) { window.location.href = "/admin/login"; return; }
        const { data } = await res.json();
        renderDetail(data);
      } catch {
        document.getElementById("d-name").textContent = "Failed to load";
      }
    }

    function renderDetail(d) {
      const { center, employees, settings, calendarConnected, weekOf, submissionCount, lastActivityAt } = d;

      document.getElementById("d-name").textContent = center.name;
      document.getElementById("d-id").textContent = center.centerId;
      document.getElementById("d-edit-btn").onclick = () => openEditModal(center.centerId);
      document.getElementById("d-delete-btn").onclick = () => deleteCenter(center.centerId, center.name);

      // Employees
      const pinCount = employees.filter(e => e.hasPin).length;
      document.getElementById("d-emp-count").textContent = employees.length;
      document.getElementById("d-pin-sub").textContent =
        employees.length === 0 ? "No employees yet"
        : pinCount === employees.length ? "All PINs set"
        : `${employees.length - pinCount} missing PIN${employees.length - pinCount !== 1 ? "s" : ""}`;

      // Submissions
      document.getElementById("d-sub-count").textContent = `${submissionCount} / ${employees.length}`;
      document.getElementById("d-sub-sub").textContent = `for week of ${weekOf}`;

      // Calendar
      document.getElementById("d-cal-val").innerHTML = calendarConnected
        ? `<span class="admin-dot dot-green"></span>Connected`
        : `<span class="admin-dot dot-red"></span>Not connected`;

      // Form window
      const now = new Date();
      let formVal = "Not set", formSub = "No window configured";
      if (settings && settings.windowOpen) {
        const open = new Date(settings.windowOpen);
        const close = settings.windowClose ? new Date(settings.windowClose) : null;
        if (now < open) {
          formVal = `<span class="admin-dot dot-yellow"></span>Scheduled`;
          formSub = `Opens ${fmtDate(open)}`;
        } else if (!close || now <= close) {
          formVal = `<span class="admin-dot dot-green"></span>Open`;
          formSub = close ? `Closes ${fmtDate(close)}` : "No close time set";
        } else {
          formVal = `<span class="admin-dot dot-gray"></span>Closed`;
          formSub = `Closed ${fmtDate(close)}`;
        }
      }
      document.getElementById("d-form-val").innerHTML = formVal;
      document.getElementById("d-form-sub").textContent = formSub;

      // Last submission
      if (lastActivityAt) {
        document.getElementById("d-activity-val").textContent = timeAgo(new Date(lastActivityAt));
        document.getElementById("d-activity-sub").textContent = fmtDate(new Date(lastActivityAt));
      } else {
        document.getElementById("d-activity-val").textContent = "None";
        document.getElementById("d-activity-sub").textContent = "No submissions yet";
      }

      // Employee list
      const empEl = document.getElementById("d-emp-list");
      if (employees.length === 0) {
        empEl.innerHTML = "<div class='emp-empty'>No employees added yet.</div>";
      } else {
        const priorityLabel = ["Normal", "Priority", "High Priority"];
        const priorityClass = ["pri-0", "pri-1", "pri-2"];
        empEl.innerHTML = employees
          .sort((a, b) => b.priority - a.priority || a.name.localeCompare(b.name))
          .map(e => `
            <div class="emp-row">
              <div class="emp-name">${esc(e.name)}</div>
              <span class="emp-priority ${priorityClass[e.priority] || "pri-0"}">${priorityLabel[e.priority] || "Normal"}</span>
              ${e.hasPin
                ? `<span class="emp-pin">PIN: ${esc(e.pin)}</span>`
                : `<span class="emp-pin-missing">No PIN</span>`}
            </div>
          `).join("");
      }
    }

    // ── Helpers ───────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function fmtDate(d) {
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    function timeAgo(d) {
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 60) return "Just now";
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}d ago`;
      return fmtDate(d);
    }

    // ── Add / Edit modal ──────────────────────────────────────
    function openAddModal() {
      _editingCenterId = null;
      document.getElementById("modal-title").textContent = "Add Center";
      document.getElementById("modal-submit").textContent = "Add Center";
      document.getElementById("field-centerid").style.display = "";
      document.getElementById("m-password-hint").style.display = "none";
      document.getElementById("m-centerid").value = "";
      document.getElementById("m-name").value = "";
      document.getElementById("m-password").value = "";
      document.getElementById("modal-error").textContent = "";
      document.getElementById("modal-overlay").classList.add("open");
      setTimeout(() => document.getElementById("m-centerid").focus(), 50);
    }

    function openEditModal(centerId) {
      const center = _centers.find(c => c.centerId === centerId);
      if (!center) return;
      _editingCenterId = centerId;
      document.getElementById("modal-title").textContent = "Edit Center";
      document.getElementById("modal-submit").textContent = "Save Changes";
      document.getElementById("field-centerid").style.display = "none";
      document.getElementById("m-password-hint").style.display = "";
      document.getElementById("m-name").value = center.name;
      document.getElementById("m-password").value = "";
      document.getElementById("modal-error").textContent = "";
      document.getElementById("modal-overlay").classList.add("open");
      setTimeout(() => document.getElementById("m-name").focus(), 50);
    }

    function closeModal() {
      document.getElementById("modal-overlay").classList.remove("open");
      _editingCenterId = null;
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById("modal-overlay")) closeModal();
    }

    async function submitModal() {
      const name = document.getElementById("m-name").value.trim();
      const password = document.getElementById("m-password").value;
      const errorEl = document.getElementById("modal-error");
      const btn = document.getElementById("modal-submit");
      errorEl.textContent = "";
      if (!name) { errorEl.textContent = "Display name is required."; return; }

      btn.disabled = true;
      try {
        if (_editingCenterId) {
          const body = { name };
          if (password) body.password = password;
          const res = await fetch(`/api/admin/centers/${_editingCenterId}`, {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) { errorEl.textContent = data.error || "Something went wrong."; btn.disabled = false; return; }
          closeModal();
          await loadCenters();
          if (_detailCenterId === _editingCenterId) openDetail(_detailCenterId);
        } else {
          const centerId = document.getElementById("m-centerid").value.trim().toLowerCase();
          if (!centerId) { errorEl.textContent = "Center ID is required."; btn.disabled = false; return; }
          if (!password) { errorEl.textContent = "Password is required."; btn.disabled = false; return; }
          if (!/^[a-z0-9-]+$/.test(centerId)) {
            errorEl.textContent = "Center ID can only contain lowercase letters, numbers, and hyphens.";
            btn.disabled = false; return;
          }
          const res = await fetch("/api/admin/centers", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ centerId, name, password }),
          });
          const data = await res.json();
          if (!res.ok) { errorEl.textContent = data.error || "Something went wrong."; btn.disabled = false; return; }
          closeModal();
          await loadCenters();
        }
      } catch { errorEl.textContent = "Something went wrong."; }
      btn.disabled = false;
    }

    async function deleteCenter(centerId, name) {
      if (!confirm(`Delete "${name}"?\n\nThis permanently deletes all employees, submissions, and settings for this center. This cannot be undone.`)) return;
      try {
        const res = await fetch(`/api/admin/centers/${centerId}`, { method: "DELETE" });
        if (!res.ok) { alert("Failed to delete center."); return; }
        showList();
        await loadCenters();
      } catch { alert("Something went wrong."); }
    }

    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/admin/login";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
      if (e.key === "Enter" && document.getElementById("modal-overlay").classList.contains("open")) submitModal();
    });

    loadCenters();
  </script>
</body>
</html>
